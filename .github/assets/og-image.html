<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; }
  body {
    background:
      radial-gradient(900px 500px at 88% 50%, rgba(245, 158, 11, 0.13), transparent 70%),
      #1c1917;
    color: #fafaf9;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    padding: 0 80px;
    gap: 32px;
    overflow: hidden;
  }
  .left { flex: 1 1 0; }
  .brand { display: flex; align-items: center; gap: 22px; margin-bottom: 34px; }
  .brand h1 { font-size: 76px; font-weight: 800; letter-spacing: -0.03em; }
  .brand h1 span { color: #f59e0b; }
  .tagline { font-size: 30px; line-height: 1.3; color: #e7e5e4; font-weight: 500; max-width: 560px; }
  .tagline b { color: #f59e0b; font-weight: 700; }
  .sites { margin-top: 38px; display: flex; gap: 10px; flex-wrap: wrap; }
  .chip {
    font-size: 17px; font-weight: 600; color: #d6d3d1;
    background: #292524; border: 1px solid #3a3330;
    padding: 8px 14px; border-radius: 999px;
  }
  .meta { margin-top: 26px; font-size: 17px; color: #a8a29e; letter-spacing: 0.01em; }

  .right { flex: 0 0 470px; display: flex; flex-direction: column; gap: 16px; }
  .card {
    position: relative;
    background: #292524; border: 1px solid #3a3330; border-radius: 14px;
    padding: 20px 22px; display: flex; gap: 16px; align-items: center;
  }
  .thumb { width: 64px; height: 64px; border-radius: 10px; background: #44403c; flex: none; }
  .lines { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .line { height: 11px; border-radius: 6px; background: #57534e; }
  .line.l1 { width: 82%; background: #78716c; }
  .line.l2 { width: 64%; }
  .line.l3 { width: 40%; }
  .card.hit { outline: 3px solid #f59e0b; outline-offset: 6px; }
  .badge {
    position: absolute; top: -18px; left: 14px;
    background: #f59e0b; color: #1c1917;
    font-size: 13px; font-weight: 700; letter-spacing: 0.08em;
    padding: 4px 9px; border-radius: 5px;
  }
  .collapsed {
    background: #fef3c7; border: 2px dashed #d97706; color: #78350f;
    border-radius: 10px; padding: 13px 18px;
    font-size: 17px; font-weight: 600;
  }
  .hit-wrap { margin: 8px 0; }
</style>
</head>
<body>
  <div class="left">
    <div class="brand">
      <!-- scripts/icon.svg, with a darker tile so it stands out from the background -->
      <svg width="96" height="96" viewBox="0 0 128 128" aria-hidden="true">
        <rect width="128" height="128" rx="24" fill="#0c0a09" />
        <rect x="30" y="42" width="68" height="44" rx="7" fill="#78716c" />
        <circle cx="64" cy="64" r="52" fill="none" stroke="#f59e0b" stroke-width="18" />
        <line x1="27" y1="27" x2="101" y2="101" stroke="#f59e0b" stroke-width="18" />
      </svg>
      <h1>No<span>Sponsor</span></h1>
    </div>
    <p class="tagline">Find sponsored content and <b>highlight</b>, <b>collapse</b> or <b>hide</b> it.</p>
    <div class="sites">
      <span class="chip">Google</span>
      <span class="chip">Amazon</span>
      <span class="chip">eBay</span>
      <span class="chip">YouTube</span>
      <span class="chip">Subito.it</span>
      <span class="chip">+ any site</span>
    </div>
    <p class="meta">Chrome extension · Manifest V3 · GPL-3.0</p>
  </div>

  <div class="right">
    <div class="card"><div class="thumb"></div><div class="lines"><div class="line l1"></div><div class="line l2"></div><div class="line l3"></div></div></div>
    <div class="hit-wrap">
      <div class="card hit"><span class="badge">SPONSOR</span><div class="thumb"></div><div class="lines"><div class="line l1"></div><div class="line l2"></div><div class="line l3"></div></div></div>
    </div>
    <div class="card"><div class="thumb"></div><div class="lines"><div class="line l1"></div><div class="line l2"></div><div class="line l3"></div></div></div>
    <div class="collapsed">Contenuto sponsorizzato · clicca per mostrare</div>
    <div class="card"><div class="thumb"></div><div class="lines"><div class="line l1"></div><div class="line l2"></div><div class="line l3"></div></div></div>
  </div>
</body>
</html>
