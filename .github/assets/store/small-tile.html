<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<!-- Chrome Web Store small promo tile, 440 × 280. Rendered by scripts/store-assets.ts. -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 440px; height: 280px; }
  body {
    background:
      radial-gradient(360px 260px at 100% 100%, rgba(245, 158, 11, 0.18), transparent 70%),
      #1c1917;
    color: #fafaf9;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 36px;
    overflow: hidden;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  h1 { font-size: 40px; font-weight: 800; letter-spacing: -0.03em; }
  h1 span { color: #f59e0b; }
  p { margin-top: 18px; font-size: 19px; line-height: 1.35; color: #e7e5e4; font-weight: 500; }
  p b { color: #f59e0b; font-weight: 700; }
  .meta { margin-top: 14px; font-size: 14px; color: #a8a29e; }
</style>
</head>
<body>
  <div class="brand">
    <!-- scripts/icon.svg, with a darker tile so it stands out from the background -->
    <svg width="58" height="58" viewBox="0 0 128 128" aria-hidden="true">
      <rect width="128" height="128" rx="24" fill="#0c0a09" />
      <rect x="30" y="42" width="68" height="44" rx="7" fill="#78716c" />
      <circle cx="64" cy="64" r="52" fill="none" stroke="#f59e0b" stroke-width="18" />
      <line x1="27" y1="27" x2="101" y2="101" stroke="#f59e0b" stroke-width="18" />
    </svg>
    <h1>No<span>Sponsor</span></h1>
  </div>
  <p><b>Highlight</b>, <b>collapse</b> or <b>hide</b> sponsored content. YouTube ads at 16x.</p>
  <p class="meta">Google · Amazon · eBay · YouTube · Subito.it · any site</p>
</body>
</html>
