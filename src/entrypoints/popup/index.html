<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>NoSponsor</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <img src="/icon/32.png" alt="" width="20" height="20" />
      <h1>NoSponsor</h1>
    </header>

    <section class="stat">
      <div class="count" id="count">–</div>
      <div class="meta">
        <div class="label" id="countLabel" data-i18n="popupCountMany"></div>
        <div class="detector" id="detector">&nbsp;</div>
      </div>
    </section>

    <section class="group">
      <div class="group-title" data-i18n="popupModeTitle"></div>
      <div class="segmented" role="radiogroup" data-i18n-aria-label="popupModeLabel">
        <button data-mode="highlight" role="radio" data-i18n="popupModeHighlight"></button>
        <button data-mode="collapse" role="radio" data-i18n="popupModeCollapse"></button>
        <button data-mode="hide" role="radio" data-i18n="popupModeHide"></button>
      </div>
    </section>

    <section class="group">
      <label class="row">
        <span>
          <span class="row-title"
            ><span data-i18n="popupActiveOn"></span> <b id="host" data-i18n="popupThisSite"></b
          ></span>
        </span>
        <input type="checkbox" id="siteEnabled" class="switch" />
      </label>
      <label class="row">
        <span>
          <span class="row-title" data-i18n="popupGeneric"></span>
          <span class="row-hint" data-i18n="popupGenericHint"></span>
        </span>
        <input type="checkbox" id="generic" class="switch" />
      </label>
    </section>

    <footer>
      <div id="note"></div>
      <a href="#" id="report" class="report" data-i18n="popupReport"></a>
    </footer>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
